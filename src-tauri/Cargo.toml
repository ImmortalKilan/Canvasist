[package]
name = "canvasist"
version = "0.1.0"
description = "Never miss a Canvas or Gradescope deadline again."
authors = ["ImmortalKilan"]
license = "MIT"
repository = "https://github.com/ImmortalKilan/Canvasist"
edition = "2021"
rust-version = "1.85"

[lib]
# The `_lib` suffix avoids a Windows name clash between the lib and bin targets
# (https://github.com/rust-lang/cargo/issues/8519).
name = "canvasist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

# https://v2.tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
