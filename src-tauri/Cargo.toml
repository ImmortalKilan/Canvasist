[package]
name = "canvasist"
version = "0.1.2"
description = "Never miss a Canvas or Gradescope deadline again."
authors = ["ImmortalKilan"]
license = "MIT"
repository = "https://github.com/ImmortalKilan/Canvasist"
edition = "2021"
rust-version = "1.85"

[lib]
# The `_lib` suffix avoids a Windows name clash between the lib and bin targets
# (https://github.com/rust-lang/cargo/issues/8519).
name = "canvasist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
thiserror = "2"
# Windows' own TLS stack (SChannel): honours the system certificate store, which
# matters on school networks, and needs no extra native build tooling.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "cookies", "json", "query", "gzip", "charset", "http2", "system-proxy"] }
# Default features off: no public-suffix list download, and cookie values are
# never written to logs (`log_secure_cookie_values` stays disabled).
cookie_store = { version = "0.22", default-features = false, features = ["serde_json"] }
url = { version = "2", features = ["serde"] }
time = { version = "0.3", features = ["serde", "parsing", "formatting", "macros"] }
scraper = "0.27"
# Already used by Tauri's async runtime; only the timer is needed here.
tokio = { version = "1", default-features = false, features = ["time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

# https://v2.tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
